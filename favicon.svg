<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Document body (folded top-left corner) -->
  <path d="M90 10 L380 10 L380 390 L10 390 L10 90 Z" fill="#111"/>
  <!-- Corner fold triangle (cut out) -->
  <polygon points="10,10 90,10 10,90" fill="white"/>
  <!-- Top text lines (after fold) -->
  <rect x="110" y="40"  width="240" height="22" rx="11" fill="white"/>
  <rect x="110" y="78"  width="240" height="22" rx="11" fill="white"/>
  <!-- Body text lines -->
  <rect x="30" y="130" width="220" height="20" rx="10" fill="white"/>
  <rect x="30" y="165" width="190" height="20" rx="10" fill="white"/>
  <rect x="30" y="200" width="210" height="20" rx="10" fill="white"/>
  <rect x="30" y="235" width="170" height="20" rx="10" fill="white"/>
  <rect x="30" y="270" width="200" height="20" rx="10" fill="white"/>
  <rect x="30" y="305" width="150" height="20" rx="10" fill="white"/>
  <rect x="30" y="340" width="180" height="20" rx="10" fill="white"/>

  <!-- Magnifying glass outer ring -->
  <circle cx="340" cy="340" r="158" fill="#111"/>
  <!-- Magnifying glass white ring -->
  <circle cx="340" cy="340" r="138" fill="white"/>
  <!-- Magnifying glass inner (dark lens) -->
  <circle cx="340" cy="340" r="108" fill="#111"/>
  <!-- Glare highlight -->
  <circle cx="298" cy="295" r="22" fill="white" opacity="0.35"/>

  <!-- Handle -->
  <rect x="444" y="430" width="62" height="50" rx="14" transform="rotate(45 475 455)" fill="#111"/>
</svg>
